{% extends 'base.html' %}

{% block title %}Eliminar Post{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6">
    <div class="card shadow-sm border-0 p-4 text-center">
      <i class="bi bi-exclamation-triangle text-danger fs-1 mb-3"></i>
      <h4 class="fw-bold">¿Estás seguro de eliminar este post?</h4>
      <p class="text-muted">"{{ object.titulo }}"</p>
      <p class="text-danger small">Esta acción no se puede deshacer.</p>

      <form method="post" class="d-flex justify-content-center gap-2 mt-3">
        {% csrf_token %}
        <a href="{% url 'blog:post_detalle' object.pk %}" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-danger fw-bold">Sí, eliminar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
